<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analog Atlas detail</title>
<style>
  :root { --bg:#0b1020; --panel:#141b33; --line:#2a3560; --text:#e8ecf8; --mute:#9aa6c9; --accent:#5fd0ff; --good:#58d68d; --warn:#f5b041; --bad:#ec7063; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6fb; --panel:#fff; --line:#d5dbee; --text:#162040; --mute:#5b678c; --accent:#0a6fb5; --good:#1e8f55; --warn:#b9770e; --bad:#c0392b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  header.top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:12px; }
  header.top input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:min(360px, 100%); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { margin:0 0 8px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  h1 { margin:0; font-size:26px; } .sub { color:var(--mute); margin:2px 0 8px; }
  .hero { display:grid; grid-template-columns:minmax(0,280px) 1fr; gap:16px; margin-bottom:14px; }
  @media (max-width:700px) { .hero { grid-template-columns:1fr; } }
  .hero img { width:100%; border-radius:10px; display:block; background:#222; aspect-ratio:4/3; object-fit:cover; }
  .credit { color:var(--mute); font-size:12px; margin-top:4px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  .tabs button { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; font:inherit; }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:#06121f; border-color:var(--accent); font-weight:600; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; max-width:100%; }
  .big { font-size:54px; font-weight:700; line-height:1; } .big small { font-size:18px; color:var(--mute); font-weight:400; }
  .bars .row { display:grid; grid-template-columns:110px 1fr 70px; gap:8px; align-items:center; margin:5px 0; }
  .track { height:10px; background:var(--line); border-radius:6px; overflow:hidden; } .track span { display:block; height:100%; background:var(--accent); }
  .num { text-align:right; font-variant-numeric:tabular-nums; } .mute { color:var(--mute); }
  ul { margin:6px 0; padding-left:20px; } li { margin:3px 0; }
  table { border-collapse:collapse; width:100%; } td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; } th { color:var(--mute); font-weight:500; }
  .metrics { columns:2; column-gap:20px; font-size:13px; } .metrics div { break-inside:avoid; display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding:2px 0; }
  .caveat { border-left:3px solid var(--warn); padding-left:10px; margin:6px 0; }
  .alt { border-left:3px solid var(--good); padding-left:10px; margin:6px 0; }
  a { color:var(--accent); } .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 9px; margin:0 4px 4px 0; font-size:12px; color:var(--mute); }
</style>
</head>
<body>
<main>
  <header class="top">
    <strong>ANALOG ATLAS · place detail</strong>
    <input id="search" list="names" placeholder="Search a site or target (try Athlone, Jezero, Haughton)" aria-label="Search sites">
    <datalist id="names"></datalist>
  </header>
  <div id="app">Loading data…</div>
</main>
<script>
(async () => {
  const PRESETS = [['raw', 'Just similarities'], ['crewed', 'Crewed mission'], ['base', 'Base construction'], ['rover', 'Rover landing']];
  const DIMS = [['terrain', 'Terrain'], ['geology', 'Geology'], ['thermal', 'Thermal'], ['water', 'Water and ice'], ['dust', 'Dust and wind'], ['subsurface', 'Subsurface'], ['habitability', 'Habitability'], ['operations', 'Operations']];
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);
  let sites;
  try { sites = await (await fetch('../out/sites.json')).json(); }
  catch (e) { $('app').textContent = 'Could not load ../out/sites.json. Serve the repo root, for example: node prototype/server.js . 8000'; return; }
  const byId = Object.fromEntries(sites.map((s) => [s.id, s]));
  $('names').innerHTML = sites.map((s) => `<option value="${esc(s.name)}">`).join('');
  $('search').addEventListener('change', (e) => { const s = sites.find((x) => x.name.toLowerCase() === e.target.value.toLowerCase()); if (s) go(s.id); });
  const state = { preset: 'raw', target: null };
  const go = (id) => { history.replaceState(null, '', '?id=' + encodeURIComponent(id)); state.target = null; render(); };
  const pct = (v) => (v === null || v === undefined || Number.isNaN(v) ? '—' : Math.round(v));
  const nm = (id) => byId[id]?.name || id;
  const cellText = (c) => `${esc(c.name)} (${c.lat.toFixed(1)}, ${c.lon.toFixed(1)}) · ${c.score}`;

  function metricsHtml(s) {
    const rows = Object.entries(s.metrics || {}).map(([k, m]) => `<div><span class="mute">${esc(k.replace(/_/g, ' '))}</span><span>${m.value}${m.unit ? ' ' + esc(m.unit) : ''}</span></div>`).join('');
    return `<div class="metrics">${rows}</div>`;
  }
  const head = (s) => {
    const img = s.image_local ? `../out/images/${s.id}.jpg` : s.image_url;
    return `<section class="hero"><div>${img ? `<img src="${esc(img)}" alt="${esc(s.name)}" onerror="this.style.display='none'">` : ''}<div class="credit">${esc(s.image_credit)}</div></div>
      <div><div class="mute">${s.body === 'earth' ? 'EARTH ANALOG' : s.body.toUpperCase() + ' TARGET'} · ${esc(s.environment)}</div><h1>${esc(s.name)}</h1>
      <div class="sub">${esc(s.region)}${s.country ? ' · ' + esc(s.country) : ''} · ${s.lat.toFixed(2)}, ${s.lon.toFixed(2)}</div><p>${esc(s.summary)}</p>
      <div>${(s.programs || []).map((p) => `<span class="pill">${esc(p)}</span>`).join('')}</div>
      <div>${s.wikipedia_url ? `<a href="${esc(s.wikipedia_url)}" target="_blank" rel="noopener">Wikipedia ▸</a>` : ''}</div></div></section>`;
  };
  const caveats = (s) => `<div class="card"><h2>What Earth cannot reproduce (never scored)</h2>${(s.caveats || []).map((c) => `<div class="caveat">${esc(c)}</div>`).join('')}</div>`;
  const links = (s) => `<div class="card"><h2>Learn more</h2><ul>${(s.links || []).map((u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, ''))}</a></li>`).join('') || '<li class="mute">—</li>'}</ul>
      <div class="credit">Data sources: see terrain_data/DATA_SOURCES.md. Pictures from Wikimedia Commons; credit shown with each.</div></div>`;

  function earthView(s) {
    const tids = Object.keys(s.matches).filter((t) => (s.targets || []).includes(byId[t]?.body));
    const best = Object.values(s.best_target || {});
    if (!state.target || !s.matches[state.target]) state.target = best.sort((a, b) => (s.matches[b].overall || 0) - (s.matches[a].overall || 0))[0] || tids[0];
    const m = s.matches[state.target], t = byId[state.target];
    const alt = (m.alternative_by_preset && m.alternative_by_preset[state.preset]) || m.alternative || {};
    const losses = (m.losses_by_preset && m.losses_by_preset[state.preset]) || m.losses;
    const opts = tids.sort((a, b) => (s.matches[b].overall || 0) - (s.matches[a].overall || 0)).map((id) => `<option value="${esc(id)}" ${id === state.target ? 'selected' : ''}>${esc(nm(id))} (${byId[id].body}) · ${pct(s.matches[id].overall)}</option>`).join('');
    const bars = DIMS.map(([k, label]) => { const v = m.dims[k]; return `<div class="row"><span>${label}</span><div class="track"><span style="width:${v == null ? 0 : v * 100}%"></span></div><span class="num">${v == null ? '—' : Math.round(v * 100)} <span class="mute">${Math.round((m.coverage[k] || 0) * 100)}%</span></span></div>`; }).join('');
    const altRows = [['same_country', 'Best place in the same country'], ['within_1000km', 'Best place within 1,000 km'], ['worldwide', 'Best place anywhere on Earth']]
      .filter(([k]) => alt[k]).map(([k, l]) => `<div class="alt"><strong>${l}:</strong> ${esc(alt[k].name)} (${alt[k].lat}, ${alt[k].lon}), score ${alt[k].score}, ${alt[k].distance_km.toLocaleString()} km away</div>`).join('');
    return `${head(s)}
      <div class="card" style="margin-bottom:14px"><h2>Compare with</h2><select id="target" aria-label="Moon or Mars target">${opts}</select>
        <div class="tabs" role="group" aria-label="Preset">${PRESETS.map(([id, l]) => `<button data-p="${id}" aria-pressed="${id === state.preset}">${l}</button>`).join('')}</div>
        <div class="big">${pct(m.presets[state.preset])}<small> / 100 similarity</small></div>
        <div class="mute">${esc(PRESETS.find((p) => p[0] === state.preset)[1])} · ${esc(s.name)} against ${esc(t.name)}</div></div>
      <div class="grid">
        <div class="card bars"><h2>Eight dimensions (match · data coverage)</h2>${bars}
          <table style="margin-top:8px"><tr><th>Preset</th>${PRESETS.map(([, l]) => `<th>${l}</th>`).join('')}</tr><tr><td>Score</td>${PRESETS.map(([id]) => `<td>${pct(m.presets[id])}</td>`).join('')}</tr></table></div>
        <div class="card"><h2>How to raise the similarity</h2>${losses && losses.length ? `<ul>${losses.map((l) => `<li>${esc(l.text)} <span class="mute">(−${l.points} points)</span></li>`).join('')}</ul>` : '<p class="mute">Detailed losses are stored for each site\'s five best targets per body and the demo targets. Pick one of those.</p>'}
          <h2 style="margin-top:14px">Cut your losses, go here instead</h2>${altRows || '<p class="mute">—</p>'}</div>
        ${caveats(s)}${links(s)}
        <div class="card" style="grid-column:1/-1"><h2>Everything we measured here</h2>${metricsHtml(s)}${s.data_cell?.borrowed_km ? `<div class="credit">No data in its own cell; borrowed from a cell ${s.data_cell.borrowed_km} km away.</div>` : ''}</div>
      </div>`;
  }

  function targetView(s) {
    const lists = PRESETS.map(([id, l]) => `<tr><td>${l}</td><td>${(s.top_sites_by_preset?.[id] || []).slice(0, 3).map((x) => `${esc(nm(x.id))} ${x.score}`).join(' · ')}</td></tr>`).join('');
    return `${head(s)}<div class="grid">
      <div class="card"><h2>Best named Earth analogs by preset</h2><table>${lists}</table></div>
      <div class="card"><h2>Best Earth places, whole planet</h2><ul>${(s.top_cells || []).slice(0, 8).map((c) => `<li>${cellText(c)}</li>`).join('')}</ul></div>
      <div class="card"><h2>Beyond the usual suspects</h2><p class="mute">Best places at least 300 km from any known analog site.</p><ul>${(s.surprise_cells || []).map((c) => `<li>${cellText(c)}</li>`).join('')}</ul></div>
      ${caveats(s)}${links(s)}<div class="card"><h2>What we know about this place</h2>${metricsHtml(s)}${s.coord_status === 'approximate' ? '<div class="credit">Position is approximate.</div>' : ''}</div></div>`;
  }

  function render() {
    const id = new URLSearchParams(location.search).get('id') || 'athlone';
    const s = byId[id] || byId.athlone;
    document.title = s.name + ' · Analog Atlas';
    $('app').innerHTML = s.body === 'earth' ? earthView(s) : targetView(s);
    const sel = $('target'); if (sel) sel.addEventListener('change', (e) => { state.target = e.target.value; render(); });
    document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { state.preset = b.dataset.p; render(); }));
  }
  render();
})();
</script>
</body>
</html>
